version: '3.8'

services:
  # Database utama untuk menyimpan data Order, User, dan Truk
  postgres:
    image: postgres:15-alpine
    container_name: jbm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: jalur_berlian_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database cepat (In-memory) untuk tracking posisi truk secara real-time
  redis:
    image: redis:7-alpine
    container_name: jbm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server dengan Swagger Documentation
  jb-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jbm_api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://admin:password123@postgres:5432/jalur_berlian_db
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      GIN_MODE: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: