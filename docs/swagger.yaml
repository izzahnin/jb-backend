basePath: /
definitions:
  model.CreateUserRequest:
    properties:
      is_active:
        description: 'Default: true'
        type: boolean
      password:
        description: Password plain text
        type: string
      role:
        description: '''admin'' atau ''customer'' (admin pilih)'
        type: string
      username:
        description: Username (wajib, unique)
        type: string
    required:
    - password
    - role
    - username
    type: object
  model.LoginRequest:
    properties:
      password:
        description: Password plain text (bcrypt di server)
        type: string
      username:
        description: Username (wajib)
        type: string
    required:
    - password
    - username
    type: object
  model.LoginResponse:
    properties:
      expires_at:
        description: Unix timestamp kapan token expired
        type: integer
      token:
        description: JWT token untuk Authorization header
        type: string
      user:
        allOf:
        - $ref: '#/definitions/model.User'
        description: User yang login (untuk UI)
    type: object
  model.Order:
    properties:
      created_at:
        type: string
      destination:
        type: string
      id:
        type: integer
      order_number:
        type: string
      origin:
        type: string
      status:
        type: string
      truck_id:
        description: Menggunakan pointer agar bisa NULL
        type: integer
    type: object
    example:
      order_number: ORD-202603-001
      origin: Jakarta Pusat
      destination: Bandung Raya
  model.RegisterRequest:
    properties:
      password:
        description: Password plain text (minimal 6 char)
        type: string
      role:
        description: '''customer'' (default), can request ''admin'''
        type: string
      username:
        description: Username (wajib, unique)
        type: string
    required:
    - password
    - username
    type: object
  model.RegisterResponse:
    properties:
      expires_at:
        description: Unix timestamp kapan token expired
        type: integer
      token:
        description: JWT token untuk langsung bisa login
        type: string
      user:
        allOf:
        - $ref: '#/definitions/model.User'
        description: User yang baru dibuat
    type: object
  model.Truck:
    properties:
      driver_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      plate_number:
        type: string
    type: object
    example:
      plate_number: B-1234-ABC
      driver_name: Budiman Hartono
      is_active: true
  model.User:
    properties:
      created_at:
        description: Timestamp saat user dibuat
        type: string
      id:
        description: Primary key auto-increment
        type: integer
      is_active:
        description: Untuk soft delete user
        type: boolean
      role:
        description: '''admin'' atau ''customer'''
        type: string
      username:
        description: Unique username untuk login
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@jalurberlian.id
    name: API Support
    url: http://www.jalurberlian.id/support
  description: Real-time fleet management and order tracking system for PT. Jalur
    Berlian Makassar
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Jalur Berlian Fleet Management API
  version: "1.0"
paths:
  /admin/orders:
    get:
      description: Get all orders with pagination support
      parameters:
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List all orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create a new order with pending status
      parameters:
      - description: Order details
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/model.Order'
      produces:
      - application/json
      responses:
        "201":
          description: Order created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a new order
      tags:
      - Orders
  /admin/orders/{id}:
    delete:
      description: Cancel an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order cancelled
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Cannot cancel order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Cancel order
      tags:
      - Orders
    get:
      description: Retrieve a specific order by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order details
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get order details
      tags:
      - Orders
    patch:
      consumes:
      - application/json
      description: Update the status of an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: payload
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Status updated
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Invalid status transition
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update order status
      tags:
      - Orders
  /admin/orders/{id}/confirm-delivery:
    post:
      description: 'Confirm order delivery (status change: in_transit → delivered)'
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Delivery confirmed
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Invalid status for delivery
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Confirm delivery
      tags:
      - Orders
  /admin/orders/{id}/confirm-pickup:
    post:
      description: 'Confirm order pickup (status change: pickup → in_transit)'
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Pickup confirmed
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Invalid status for pickup
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Confirm pickup
      tags:
      - Orders
  /admin/orders/assign:
    patch:
      consumes:
      - application/json
      description: Assign a truck to an order
      parameters:
      - description: Order and Truck IDs
        in: body
        name: payload
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Truck assigned
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order or Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Assign truck to order
      tags:
      - Orders
  /admin/trucks:
    get:
      description: Get all trucks with pagination support
      parameters:
      - description: Items per page (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of trucks
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List all trucks
      tags:
      - Trucks
    post:
      consumes:
      - application/json
      description: Register a new truck in the fleet
      parameters:
      - description: Truck details
        in: body
        name: truck
        required: true
        schema:
          $ref: '#/definitions/model.Truck'
      produces:
      - application/json
      responses:
        "201":
          description: Truck created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a new truck
      tags:
      - Trucks
  /admin/trucks/{id}:
    delete:
      description: Deactivate a truck from fleet
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Truck deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete truck
      tags:
      - Trucks
    get:
      description: Retrieve a specific truck by ID
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Truck details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get truck details
      tags:
      - Trucks
    put:
      consumes:
      - application/json
      description: Update truck details
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated truck details
        in: body
        name: truck
        required: true
        schema:
          $ref: '#/definitions/model.Truck'
      produces:
      - application/json
      responses:
        "200":
          description: Truck updated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update truck information
      tags:
      - Trucks
  /admin/users:
    post:
      consumes:
      - application/json
      description: Create a new admin or customer user with username, password, and
        role
      parameters:
      - description: User creation data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            type: object
        "400":
          description: Invalid input or role must be admin or customer
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Username already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable entity
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create new user
      tags:
      - Users
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password to get JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with JWT token
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Invalid request format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Logout user (stateless JWT - just discard token on client side)
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing authorization header
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: User logout
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register new admin user with username and password
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            $ref: '#/definitions/model.RegisterResponse'
        "400":
          description: Invalid request format
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Username already exists
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User registration
      tags:
      - Authentication
  /public/orders/{order_number}/track:
    get:
      consumes:
      - application/json
      description: Track order status and assignment without authentication. Returns
        order status, truck info, and real-time location
      parameters:
      - description: Order number (e.g., ORD-001)
        in: path
        name: order_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order tracking data with truck and location info
          schema:
            type: object
        "400":
          description: Invalid order number
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Track public order
      tags:
      - Public
  /trucks/{id}/location:
    get:
      consumes:
      - application/json
      description: Retrieve the most recent location data for a specific truck in
        real-time
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Latest location data
          schema:
            type: object
        "400":
          description: Invalid truck ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck or location not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get latest truck location
      tags:
      - Locations
    post:
      consumes:
      - application/json
      description: Record GPS coordinates and timestamp for a specific truck for real-time
        tracking
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      - description: Location data
        in: body
        name: body
        required: true
        schema:
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
            ts:
              type: string
          example:
            lat: -8.5
            lon: 120.7
            ts: '2026-03-17T16:45:00Z'
      produces:
      - application/json
      responses:
        "200":
          description: Location saved successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid truck ID or JSON format
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record truck location
      tags:
      - Locations
  /trucks/{id}/locations:
    get:
      consumes:
      - application/json
      description: Retrieve location history for a specific truck with pagination
        support
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      - default: 50
        description: Number of records (max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Location history data
          schema:
            type: object
        "400":
          description: Invalid truck ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get truck location history
      tags:
      - Locations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
