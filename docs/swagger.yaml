basePath: /
definitions:
  handler.DashboardStats:
    properties:
      active_trucks:
        type: integer
      order_breakdown:
        properties:
          cancelled:
            type: integer
          completed:
            type: integer
          partial:
            type: integer
          pending:
            type: integer
        type: object
      total_admins:
        type: integer
      total_orders:
        type: integer
      total_trucks:
        type: integer
      total_users:
        type: integer
    type: object
  model.AdminSetupRequest:
    properties:
      full_name:
        description: Full name untuk display (optional, default = username jika kosong)
        example: System Administrator
        type: string
      password:
        description: Admin password plain text (minimal 6 char)
        example: admin123456
        type: string
      username:
        description: Admin username (wajib, unique)
        example: superadmin
        type: string
    required:
    - password
    - username
    type: object
  model.CreateCustomerRequest:
    properties:
      address:
        example: Jl. Sudirman No. 123, Jakarta
        type: string
      company_name:
        example: PT. Nusantara Logistik
        type: string
      email:
        example: budi@nusantara.co.id
        type: string
      npwp:
        example: 01.234.567.8-901.000
        type: string
      phone:
        example: "+628123456789"
        type: string
      pic_name:
        example: Budi Santoso
        type: string
    required:
    - company_name
    - phone
    - pic_name
    type: object
  model.CreateDriverRequest:
    properties:
      is_active:
        example: true
        type: boolean
      license_number:
        example: SIM-B-1234567
        type: string
      name:
        example: Andi Wijaya
        type: string
      phone:
        example: "+6281122334455"
        type: string
      status:
        example: available
        type: string
    required:
    - license_number
    - name
    - phone
    type: object
  model.CreateLocationRequest:
    properties:
      lat:
        example: -6.2
        type: number
      lon:
        example: 106.816666
        type: number
      speed:
        example: 45.5
        type: number
      ts:
        example: "2026-04-19T08:30:00Z"
        type: string
    required:
    - lat
    - lon
    type: object
  model.CreateOrderRequest:
    properties:
      customer_id:
        description: Reference to customer
        example: 1
        type: integer
      destination:
        description: Shipment destination
        example: Surabaya
        type: string
      order_number:
        description: Unique order identifier
        example: ORD-2026-0001
        type: string
      origin:
        description: Shipment origin
        example: Jakarta
        type: string
      total_containers:
        description: Number of containers
        example: 5
        type: integer
    required:
    - customer_id
    - destination
    - order_number
    - origin
    - total_containers
    type: object
  model.CreateTripRequest:
    properties:
      driver_id:
        description: Reference to driver
        example: 1
        type: integer
      order_id:
        description: Reference to order
        example: 1
        type: integer
      trip_number:
        description: Unique trip identifier
        example: TRIP-2026-001
        type: string
      truck_id:
        description: Reference to truck
        example: 1
        type: integer
    required:
    - driver_id
    - order_id
    - trip_number
    - truck_id
    type: object
  model.CreateTruckRequest:
    properties:
      is_active:
        description: Active status
        example: true
        type: boolean
      plate_number:
        description: Vehicle registration plate
        example: B-1234-XYZ
        type: string
      status:
        description: 'Status: available, in_use, maintenance'
        example: available
        type: string
      truck_type:
        description: Type/model of truck
        example: Fuso Box
        type: string
    required:
    - plate_number
    - status
    - truck_type
    type: object
  model.CreateUserRequest:
    properties:
      full_name:
        description: Full name untuk display (optional, default = username jika kosong)
        example: John Sales Manager
        type: string
      is_active:
        description: Pointer untuk default true jika tidak dikirim
        example: true
        type: boolean
      password:
        description: Password plain text (akan di-hash dengan bcrypt)
        example: password123456
        type: string
      role:
        description: 'Role: ''super_admin'', ''admin_sales'', atau ''admin_ops'''
        example: admin_sales
        type: string
      username:
        description: Username (wajib, unique)
        example: john.sales
        type: string
    required:
    - password
    - role
    - username
    type: object
  model.LoginRequest:
    properties:
      password:
        description: Password plain text (bcrypt di server)
        example: password123
        type: string
      username:
        description: Username (wajib)
        example: superadmin
        type: string
    required:
    - password
    - username
    type: object
  model.LoginResponse:
    properties:
      expires_at:
        description: Unix timestamp kapan token expired
        type: integer
      token:
        description: JWT token untuk Authorization header
        type: string
      user:
        allOf:
        - $ref: '#/definitions/model.User'
        description: User yang login (untuk UI)
    type: object
  model.StartTripRequest:
    properties:
      container_number:
        description: Container number
        example: CONT-123456
        type: string
      seal_number:
        description: Seal number
        example: SEAL-789012
        type: string
    required:
    - container_number
    - seal_number
    type: object
  model.UpdateCustomerRequest:
    properties:
      address:
        example: Jl. Sudirman No. 123, Jakarta
        type: string
      company_name:
        example: PT. Nusantara Logistik
        type: string
      email:
        example: budi@nusantara.co.id
        type: string
      npwp:
        example: 01.234.567.8-901.000
        type: string
      phone:
        example: "+628123456789"
        type: string
      pic_name:
        example: Budi Santoso
        type: string
    type: object
  model.UpdateDriverRequest:
    properties:
      is_active:
        example: true
        type: boolean
      license_number:
        example: SIM-B-1234567
        type: string
      name:
        example: Andi Wijaya
        type: string
      phone:
        example: "+6281122334455"
        type: string
      status:
        example: available
        type: string
    type: object
  model.UpdateOrderRequest:
    properties:
      status:
        description: New order status
        example: pending
        type: string
    required:
    - status
    type: object
  model.UpdateProfileRequest:
    properties:
      full_name:
        description: Update display name (optional)
        example: Bambang Suryanto
        type: string
      password:
        description: Update password (optional, minimal 6 karakter jika diisi)
        example: newpassword123456
        type: string
    type: object
  model.UpdateTruckRequest:
    properties:
      is_active:
        description: Update active status (optional)
        example: false
        type: boolean
      plate_number:
        description: Update plate number (optional)
        example: B-1234-XYZ
        type: string
      status:
        description: Update status (optional)
        example: maintenance
        type: string
      truck_type:
        description: Update truck type (optional)
        example: Fuso Box
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@jalurberlian.id
    name: API Support
    url: http://www.jalurberlian.id/support
  description: Real-time fleet management and order tracking system for PT. Jalur
    Berlian Makassar
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Jalur Berlian Fleet Management API
  version: "1.0"
paths:
  /admin/customers:
    get:
      description: Get list of all customers. All authenticated admins can access.
      produces:
      - application/json
      responses:
        "200":
          description: Customer list with count
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List customers
      tags:
      - Customers
    post:
      consumes:
      - application/json
      description: Create a new business customer (company/PIC/contact). All authenticated
        admins can access.
      parameters:
      - description: 'Customer data: company_name, pic_name, phone, email, address,
          npwp'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Customer created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - missing required fields
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create customer
      tags:
      - Customers
  /admin/customers/{id}:
    delete:
      description: Delete a customer by ID. All authenticated admins can access.
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Customer deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid customer ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - customer tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete customer
      tags:
      - Customers
    get:
      description: Retrieve a customer by ID.
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Customer detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid customer ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - customer tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get customer detail
      tags:
      - Customers
    patch:
      consumes:
      - application/json
      description: Update customer fields (partial). All authenticated admins can
        access.
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Customer update data (partial)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Customer updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid data
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - customer tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update customer
      tags:
      - Customers
  /admin/dashboard/stats:
    get:
      consumes:
      - application/json
      description: Get dashboard overview with order stats, truck count, user count,
        etc.
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard statistics
          schema:
            $ref: '#/definitions/handler.DashboardStats'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get dashboard statistics
      tags:
      - Admin
  /admin/drivers:
    get:
      description: Get list of all drivers. All authenticated admins can access.
      produces:
      - application/json
      responses:
        "200":
          description: Driver list with count
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List drivers
      tags:
      - Drivers
    post:
      consumes:
      - application/json
      description: Create a new driver. All authenticated admins can access.
      parameters:
      - description: 'Driver data: name, license_number, phone, status, is_active'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateDriverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Driver created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - missing required fields
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create driver
      tags:
      - Drivers
  /admin/drivers/{id}:
    delete:
      description: Deactivate a driver by ID. All authenticated admins can access.
      parameters:
      - description: Driver ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Driver deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid driver ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - driver tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Delete driver
      tags:
      - Drivers
    get:
      description: Retrieve a driver by ID.
      parameters:
      - description: Driver ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Driver detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid driver ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - driver tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get driver detail
      tags:
      - Drivers
    patch:
      consumes:
      - application/json
      description: Update driver fields (partial). All authenticated admins can access.
      parameters:
      - description: Driver ID
        in: path
        name: id
        required: true
        type: integer
      - description: Driver update data (partial)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateDriverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Driver updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid data
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - driver tidak ditemukan
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update driver
      tags:
      - Drivers
  /admin/orders:
    get:
      consumes:
      - application/json
      description: Get all orders with pagination support. Returns list of orders
        sorted by order_date DESC.
      parameters:
      - description: Items per page (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order list with count and pagination info
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_sales role required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List all orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create a new order with customer, origin, destination, and total
        containers. Status auto-set to 'pending'. Admin ID extracted from JWT.
      parameters:
      - description: 'Order details: order_number (required), customer_id (required),
          origin (required), destination (required), total_containers (required)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Order created successfully with id, order_number, customer_id,
            admin_id, origin, destination, total_containers, order_date, status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'Bad request: invalid JSON or missing required fields'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_sales role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - customer_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable entity - failed to create order
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create new commercial order
      tags:
      - Orders
  /admin/orders/{id}:
    delete:
      consumes:
      - application/json
      description: Cancel a specific order. Order must be in 'pending' or 'partial'
        status to be cancelled.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order cancelled successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_sales role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - order_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - cannot cancel order (invalid status or already completed)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Cancel order
      tags:
      - Orders
    get:
      consumes:
      - application/json
      description: Retrieve detailed information of a specific order by ID. Includes
        customer, admin, and status info.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order details with all fields
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_sales role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - order_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get order details
      tags:
      - Orders
    patch:
      consumes:
      - application/json
      description: 'Update the status of an order. Valid transitions: pending → partial/completed/cancelled,
        partial → completed/cancelled.'
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Status update: status (required, one of: pending, partial, completed,
          cancelled)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order status updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid ID or status
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_sales role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - order_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - invalid status transition
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update order status
      tags:
      - Orders
  /admin/trips/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve all trips (surat jalan) associated with a specific order
        ID. Shows trip number, status, truck, and driver assignments.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of trips for the order
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid order ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_ops role required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get trip by ID
      tags:
      - Trips
  /admin/profile:
    patch:
      consumes:
      - application/json
      description: Update your own profile information (full_name and/or password).
        All authenticated admins can access. At least one field must be provided.
        Password must be at least 6 characters. User_id is extracted from JWT token.
      parameters:
      - description: 'Profile update data: full_name (optional), password (optional,
          min 6 chars). At least one required.'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully with message and updated user
            object (id, username, full_name, role, is_active, created_at)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'Bad request: at least one field (full_name or password) must
            be provided, or password must be at least 6 characters'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - user not found in database
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable entity - failed to update profile
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error - database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Update own profile (all admin roles)
      tags:
      - User Management
  /admin/setup:
    post:
      consumes:
      - application/json
      description: Create the first super_admin user in the system (one-time endpoint,
        auto-disabled after first use). Returns JWT token for immediate use. Only
        succeeds if no admin exists yet.
      parameters:
      - description: 'Admin setup credentials: username, password (min 6 chars), optional
          full_name'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AdminSetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Super admin created successfully with JWT token. User object
            includes immutable id and auto-set created_at
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Invalid request format or invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'Conflict: Admin user already exists'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initialize first admin user (super_admin)
      tags:
      - User Management
  /admin/trips:
    get:
      description: Retrieve all trips (surat jalan) with their status, truck, and
        driver assignments. Sorted by creation date (newest first).
      produces:
      - application/json
      responses:
        "200":
          description: List of all trips with count
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_ops role required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List all trips
      tags:
      - Trips
    post:
      consumes:
      - application/json
      description: Create a new trip (surat jalan) for an order. Requires order_id,
        truck_id, driver_id, and trip_number. Allocates truck and driver for the order.
      parameters:
      - description: 'Trip details: order_id (required), truck_id (required), driver_id
          (required), trip_number (required)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateTripRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Trip created successfully with trip_number, status (assigned),
            truck and driver allocated
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid JSON or missing required fields
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_ops role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - order_id, truck_id, or driver_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - truck/driver inactive or invalid order status
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create new trip
      tags:
      - Trips
  /admin/trips/{id}/deliver:
    patch:
      consumes:
      - application/json
      description: Complete a trip by marking it as delivered. Changes trip status
        from 'in_transit' to 'delivered'. Order status automatically updated to 'completed'.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trip completed, status changed to delivered, order marked as
            completed
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid trip ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_ops role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - trip_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - cannot complete trip (invalid status or not in_transit)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Complete trip
      tags:
      - Trips
  /admin/trips/{id}/start:
    patch:
      consumes:
      - application/json
      description: Start a trip by setting container_number and seal_number. Changes
        trip status from 'assigned' to 'in_transit'. Real-time tracking begins.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Trip start details: container_number and seal_number (both required)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.StartTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Trip started, status changed to in_transit
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid ID or missing container/seal numbers
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - admin_ops role required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - trip_id tidak ada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - cannot start trip (invalid status or already in_transit)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Start trip
      tags:
      - Trips
  /admin/trucks:
    get:
      description: Get all trucks with pagination support
      parameters:
      - description: Items per page (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of trucks
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List all trucks
      tags:
      - Trucks
    post:
      consumes:
      - application/json
      description: Register a new truck in the fleet
      parameters:
      - description: 'Truck details: plate_number, truck_type, status, is_active'
        in: body
        name: truck
        required: true
        schema:
          $ref: '#/definitions/model.CreateTruckRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Truck created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create a new truck
      tags:
      - Trucks
  /admin/trucks/{id}:
    delete:
      description: |-
        Deactivate a truck from fleet
        Deactivate a truck by setting is_active to false (soft delete). Truck must not have any active trips.
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Truck deactivated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - truck still has active trips
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Deactivate a truck
      tags:
      - Trucks
    get:
      description: Retrieve a specific truck by ID
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Truck details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get truck details
      tags:
      - Trucks
    patch:
      consumes:
      - application/json
      description: Update truck details with PATCH support. Only provide fields you
        want to update (all fields are optional).
      parameters:
      - description: Truck ID
        in: path
        name: id
        required: true
        type: integer
      - description: Truck fields to update (only include fields you want to change)
        in: body
        name: truck
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTruckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Truck updated successfully with actual data from database
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Truck not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Partially update truck information
      tags:
      - Trucks
  /admin/users:
    get:
      description: Get list of all users with their username, role, and active status
        (password_hash excluded). Only super_admin can access. Returns message, count,
        and data array.
      produces:
      - application/json
      responses:
        "200":
          description: Success response with message, count, and data array of users
            (each user has id, username, full_name, role, is_active, created_at)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - super_admin role required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error - database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: List all users (super_admin only)
      tags:
      - User Management
    post:
      consumes:
      - application/json
      description: Create a new internal admin user with username, password, and role.
        Only super_admin can access. Full_name defaults to username if not provided.
        Password must be at least 6 characters.
      parameters:
      - description: 'User creation data: username (required), password (required,
          min 6 chars), full_name (optional), role (required: super_admin, admin_sales,
          or admin_ops), is_active (optional, default true)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully with user object containing id, username,
            full_name, role, is_active, created_at
          schema:
            type: object
        "400":
          description: 'Invalid input: username required, password required, password
            must be at least 6 characters, role must be one of: super_admin, admin_sales,
            admin_ops'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - super_admin role required
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict - username already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable entity - failed to create user
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error - database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Create new admin user (super_admin only)
      tags:
      - User Management
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Login with username and password to receive JWT token. Token is
        valid for 24 hours. Use token in Authorization: Bearer header for subsequent
        requests.'
      parameters:
      - description: 'Login credentials: username (required), password (required)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful - returns token, expires_at timestamp, and
            user object
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Bad request - invalid request format or missing username/password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - invalid username or password, or user inactive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login - Get JWT token
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Logout user (stateless JWT - server-side confirms, client discards
        token).
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful - delete token from client storage
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - missing Authorization header
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: User logout - Discard JWT token
      tags:
      - Authentication
  /public/orders/{order_number}/track:
    get:
      consumes:
      - application/json
      description: Track order status and assignment without authentication. Returns
        order status, truck info, and real-time location
      parameters:
      - description: Order number (e.g., ORD-001)
        in: path
        name: order_number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order tracking data with truck and location info
          schema:
            type: object
        "400":
          description: Invalid order number
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Track public order
      tags:
      - Public
  /trips/{id}/location:
    get:
      consumes:
      - application/json
      description: Retrieve the most recent GPS location for a trip. Returns the latest
        coordinate point recorded.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Latest location record with lat, lon, speed, timestamp
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid trip ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found - no location recorded for this trip
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error - failed to retrieve latest location
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get latest location
      tags:
      - Locations
    post:
      consumes:
      - application/json
      description: Save current GPS location for a trip. Accepts latitude, longitude,
        optional speed, and timestamp. Used for real-time vehicle tracking.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Location data: lat (float64 required), lon (float64 required),
          speed (float64 optional), ts (RFC3339 string optional, defaults to now)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CreateLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Location saved successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - invalid trip ID or invalid lat/lon coordinates
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save trip location
      tags:
      - Locations
  /trips/{id}/locations:
    get:
      consumes:
      - application/json
      description: Retrieve the location history for a trip. Returns all saved GPS
        coordinates in descending order (latest first). Supports pagination via limit
        parameter.
      parameters:
      - description: Trip ID
        in: path
        name: id
        required: true
        type: integer
      - description: Max number of locations to return (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Array of location records with lat, lon, speed, timestamp
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request - invalid trip ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error - failed to retrieve location history
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get location history
      tags:
      - Locations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
